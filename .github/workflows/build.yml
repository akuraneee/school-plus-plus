# Тесты и сборка на каждый push и pull request.
# При push в main публикуется релиз v<версия из manifest.json> с двумя файлами:
#   schools-plus-plus-chromium.zip — для Chrome/Edge/Яндекс и Android-браузеров с расширениями;
#   schools-plus-plus.user.js      — для iPhone (Userscripts в Safari).
# Новая версия = поднять "version" в manifest.json и запушить. Без этого обновляются файлы текущего релиза.
name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости для тестов
        run: npm ci --no-audit --no-fund

      - name: Тесты, сборка, проверка userscript
        run: npm test

      - name: Версия
        id: v
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Файлы сборки (вкладка Actions → этот запуск → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: schools-plus-plus-${{ steps.v.outputs.version }}
          path: dist/*

      - name: Релиз
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Schools++ ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/schools-plus-plus-chromium.zip
            dist/schools-plus-plus.user.js
          body: |
            **Компьютер (Chrome, Edge, Яндекс.Браузер) и Android** — `schools-plus-plus-chromium.zip`
            **iPhone (Safari + приложение Userscripts)** — `schools-plus-plus.user.js`

            Как установить — в [README](https://github.com/${{ github.repository }}#установка).
