# Тесты и сборка всех версий на каждый push и pull request.
# При каждом push в main автоматически публикуется новый релиз v<major>.<minor>.<номер сборки> со всеми файлами:
#   schools-plus-plus-chromium.zip        — расширение для Chrome/Edge/Яндекс и Android-браузеров с расширениями;
#   schools-plus-plus.user.js             — iPhone (Userscripts в Safari);
#   schools-plus-plus-android.apk         — приложение для Android;
#   schools-plus-plus-win-x64.exe         — приложение для Windows;
#   schools-plus-plus-mac-{x64,arm64}.dmg — приложение для macOS (Intel / Apple Silicon);
#   schools-plus-plus-linux-x86_64.AppImage — приложение для Linux.
# major.minor задаются в manifest.json вручную, последнее число проставляет scripts/stamp_version.py.
name: Сборка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Расширение и userscript
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Версия сборки
        id: v
        run: python3 scripts/stamp_version.py
      - run: npm ci --no-audit --no-fund
      - name: Тесты, сборка, проверка userscript
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*

  desktop:
    name: Приложение (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # без платной подписи Apple/Microsoft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Версия сборки
        run: python3 scripts/stamp_version.py
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - name: Самопроверка (расширение внутри Electron)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          npm run copy-ext
          xvfb-run -a npx electron . --selftest --no-sandbox
      - name: Сборка
        working-directory: app
        run: npm run dist -- --config.extraMetadata.version=${{ needs.web.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            app/dist/schools-plus-plus-*.exe
            app/dist/schools-plus-plus-*.dmg
            app/dist/schools-plus-plus-*.AppImage
          if-no-files-found: error

  android:
    name: APK для Android
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Версия сборки
        run: python3 scripts/stamp_version.py
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Ключ подписи (если добавлен в секреты)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан временным ключом, обновление поверх старой версии не встанет. См. README."
          fi
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android assembleRelease --console=plain
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/schools-plus-plus-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/schools-plus-plus-android.apk
          if-no-files-found: error

  release:
    name: Релиз
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.web.outputs.version }}
          name: Schools++ ${{ needs.web.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: release/*
          body: |
            | Устройство | Файл |
            |---|---|
            | Android (приложение) | `schools-plus-plus-android.apk` |
            | Windows | `schools-plus-plus-win-x64.exe` |
            | Mac (Apple M1/M2/M3/M4) | `schools-plus-plus-mac-arm64.dmg` |
            | Mac (Intel) | `schools-plus-plus-mac-x64.dmg` |
            | Linux | `schools-plus-plus-linux-x86_64.AppImage` |
            | Расширение для Chrome / Яндекс / Edge | `schools-plus-plus-chromium.zip` |
            | iPhone (Safari + Userscripts) | `schools-plus-plus.user.js` |

            Как установить — в [README](https://github.com/${{ github.repository }}#установка).
